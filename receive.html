<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>table-pad 受け取り</title><style>body{font-family:-apple-system,"Hiragino Sans",sans-serif;background:#0f1117;color:#eef1f7;max-width:620px;margin:0 auto;padding:40px 18px;line-height:1.7}.card{background:#181b24;border:1px solid #323a4d;border-radius:14px;padding:20px}button{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #4A9EFF;background:#4A9EFF;color:#fff;font-weight:700}</style></head><body><div class="card"><h1>▦ table-pad</h1><p id="msg">受け取った内容を表にしています…</p><button id="go" hidden>table-padを開く</button></div><script type="module">
import {readTablePadTransfer,consumeTablePadTransfer} from './table-pad-transfer.js';
const KEY='tp_tables_v1',CUR='tp_cur';
const uid=()=> 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function rows(p){if(p.sets)return [['集合','要素'],...p.sets.flatMap(s=>s.items.map(x=>[s.name,x]))];if(p.items)return [['項目','タグ'],...p.items.map(x=>[x.title,x.tags.join(', ')])];return[]}
function saveRows(rs){if(!rs.length)return null;let tables=[];try{tables=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}const w=Math.max(...rs.map(r=>r.length));const d=rs.map(r=>{const a=r.slice();while(a.length<w)a.push('');return a});const t={id:uid(),title:'voice-padからの受け取り',d,header:true,at:Date.now()};tables.push(t);localStorage.setItem(KEY,JSON.stringify(tables));localStorage.setItem(CUR,t.id);return t}
function go(){location.href='./'}
try{const tr=readTablePadTransfer();if(!tr){throw new Error('受け取りデータがありません。')}const rs=rows(tr.payload);if(!rs.length)throw new Error('表にできるデータがありません。');saveRows(rs);consumeTablePadTransfer(tr.source);document.getElementById('msg').textContent='受け取りました。table-padを開きます。';setTimeout(go,250);document.getElementById('go').hidden=false;document.getElementById('go').onclick=go}catch(e){document.getElementById('msg').textContent='受け取りに失敗しました：'+e.message;document.getElementById('go').hidden=false;document.getElementById('go').onclick=go}
</script></body></html>
